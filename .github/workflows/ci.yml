name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

  # Deploy to production only on main branch if the build succeeded
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Write deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Validate deploy key
        run: |
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY secret is not a valid private key (failed to parse)." \
                 "Re-upload it with 'gh secret set DEPLOY_SSH_KEY < path/to/key' to avoid newline/formatting corruption."
            exit 1
          fi

      - name: Deploy via SSH (3 attempts, 20 s apart)
        # GitHub Actions runners rotate across a large Azure IP pool. Some IPs are
        # blocked by the server firewall (i/o timeout = silent DROP, not REJECT).
        # Retry up to 3 times; each attempt gets the same runner/IP so we also add
        # a short sleep to let any transient block expire before the next try.
        run: |
          for attempt in 1 2 3; do
            echo "=== Deploy attempt $attempt/3 ==="
            if ssh \
              -i ~/.ssh/deploy_key \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              '/var/www/danielius/deploy.sh'; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed — waiting 20s before retry..."
              sleep 20
            fi
          done
          echo "All 3 deploy attempts failed"
          exit 1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
